<script>
window.WX = (function () {
  function param(k, def) {
    return new URLSearchParams(location.search).get(k) || def;
  }
  // replaceState, not pushState: these are settings on one page, and filling
  // the back button with them would break the way back out of the page.
  function setParam(k, v, def) {
    var q = new URLSearchParams(location.search);
    if (v == null || v === "" || v === def) q.delete(k); else q.set(k, v);
    var t = q.toString();
    history.replaceState(null, "", location.pathname + (t ? "?" + t : "") + location.hash);
  }
  function picker(id, onChange) {
    var el = document.getElementById(id);
    if (el) el.addEventListener("change", function () { onChange(el.value); });
    return el;
  }
  function overflow(wrapId, btnId, menuId) {
    var wrap = document.getElementById(wrapId),
        btn = document.getElementById(btnId),
        menu = document.getElementById(menuId);
    if (!wrap || !btn || !menu) return;
    function close() { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var open = menu.hidden;
      menu.hidden = !open;
      btn.setAttribute("aria-expanded", String(open));
    });
    // Anywhere outside, and Escape. A menu that only its own button can close
    // is a menu people leave open by accident.
    document.addEventListener("click", function (e) {
      if (!menu.hidden && !wrap.contains(e.target)) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !menu.hidden) { close(); btn.focus(); }
    });
  }
  return { param: param, setParam: setParam, picker: picker, overflow: overflow };
})();
</script>
<style>
  :root {
    /* canvas & surfaces */
    --bg:#f4f3f7; --bg-tint:#edecf4;
    --surface-1:#ffffff; --surface-2:#f2f1f7; --surface-3:#e7e6f0;

    /* glass materials — deliberately low alpha: the blur and the rim light do
       the work. High alpha is the "solid white card" mistake. */
    --glass-thin:rgba(255,255,255,.22); --glass-regular:rgba(255,255,255,.34);
    --glass-thick:rgba(255,255,255,.5);
    --glass-highlight:rgba(255,255,255,.9); --glass-shadow-edge:rgba(0,0,0,.05);

    /* hairlines */
    --border:rgba(52,50,68,.12); --border-strong:rgba(52,50,68,.22);
    --separator:rgba(52,50,68,.15);

    /* ink */
    --ink:#1b1a22; --ink-muted:rgba(56,54,72,.62); --ink-faint:rgba(56,54,72,.32);
    --ink-on-accent:#ffffff;

    /* one interactive tint, one secondary. Indigo + teal — the budget app's
       sibling palette, not its twin. */
    --accent:#5e5ce6; --accent-press:#4a48c9; --accent-soft:rgba(94,92,230,.12);
    --secondary:#30b0c7;
    --positive:#34c759; --warning:#ff9f0a; --negative:#ff3b30;

    /* Temperature. Hue says day or night; depth within the hue says how extreme
       the threshold is. That keeps all four series legible together and keeps
       every one of them clear of the indigo accent, which is chrome only. */
    --night-1:#5aa9e6; --night-2:#1f6fb2;
    --day-1:#f2a03d;   --day-2:#d63b34;

    /* Air quality: the six AQI categories, retuned from the official US EPA
       swatches so they hold contrast on both themes (raw #FFFF00 is unreadable
       on white, and #00E400 vibrates). Hue identity is preserved, so the ramp
       still reads as the one people know. */
    --aqi-1:#39a852; --aqi-2:#d4a017; --aqi-3:#ef8033; --aqi-4:#e0483f;
    --aqi-5:#9c4fbf; --aqi-6:#8c2740;

    /* Ink for text sitting *on* a category fill. Black holds on the first four
       swatches and white on the last two; the flip happens where the ramp turns
       purple. Every pairing here clears 4.5:1, checked against both themes. */
    --aqi-1-ink:#12101a; --aqi-2-ink:#12101a; --aqi-3-ink:#12101a;
    --aqi-4-ink:#12101a; --aqi-5-ink:#ffffff; --aqi-6-ink:#ffffff;

    /* Hatching for an unfinished month. It runs opposite the ink, never with
       it: stripes drawn toward the ink drag the fill under the digits and cost
       contrast, while stripes drawn away from it buy a little. */
    --aqi-1-hatch:rgba(255,255,255,.38); --aqi-2-hatch:rgba(255,255,255,.38);
    --aqi-3-hatch:rgba(255,255,255,.38); --aqi-4-hatch:rgba(255,255,255,.38);
    --aqi-5-hatch:rgba(0,0,0,.34); --aqi-6-hatch:rgba(0,0,0,.34);

    /* geometry */
    --r-xs:10px; --r-sm:14px; --r-md:24px; --r-lg:30px; --r-xl:38px; --r-full:9999px;

    /* elevation — soft and layered, never one hard drop */
    --shadow-1:0 1px 2px rgba(24,22,40,.05), 0 1px 1px rgba(24,22,40,.04);
    --shadow-2:0 4px 16px -4px rgba(24,22,40,.10), 0 1px 3px rgba(24,22,40,.06);
    --shadow-3:0 12px 40px -8px rgba(24,22,40,.16), 0 2px 8px rgba(24,22,40,.07);

    --blur-sm:blur(10px) saturate(180%); --blur-md:blur(14px) saturate(185%);
    --blur-lg:blur(18px) saturate(190%);

    --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.65,0,.35,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);

    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
    --dock-h:60px; --maxw:1100px;
    color-scheme:light;
  }

    --surface-1:#17171f; --surface-2:#212129; --surface-3:#2c2c36;

    --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.22);

    --ink:#f4f3f8; --ink-muted:rgba(235,234,245,.62); --ink-faint:rgba(235,234,245,.34);
    --accent:#7d7bff; --accent-press:#9b99ff; --accent-soft:rgba(125,123,255,.26);
    --secondary:#40c8e0;
    --positive:#30d158; --warning:#ffd60a; --negative:#ff453a;
    --night-1:#6fbcf0; --night-2:#4d92dd; --day-1:#ffab5c; --day-2:#ff6b62;
    --aqi-1:#4ed16a; --aqi-2:#f2ca5c; --aqi-3:#ff9f4a; --aqi-4:#ff6b62;

    --aqi-4-ink:#12101a; --aqi-5-ink:#12101a; --aqi-6-ink:#12101a;
    --aqi-1-hatch:rgba(255,255,255,.38); --aqi-2-hatch:rgba(255,255,255,.38);
    --aqi-3-hatch:rgba(255,255,255,.38); --aqi-4-hatch:rgba(255,255,255,.38);
    --aqi-5-hatch:rgba(255,255,255,.38); --aqi-6-hatch:rgba(255,255,255,.38);
    --shadow-1:0 1px 2px rgba(0,0,0,.5);

} }
  :root[data-theme="dark"] { color-scheme:dark;
    --bg:#0b0b12; --bg-tint:#0e0e17;
    --surface-1:#17171f; --surface-2:#212129; --surface-3:#2c2c36;
    --glass-thin:rgba(23,23,31,.55); --glass-regular:rgba(25,25,34,.62);
    --glass-thick:rgba(25,25,34,.78);
    --glass-highlight:rgba(255,255,255,.10); --glass-shadow-edge:rgba(0,0,0,.5);
    --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.22);
    --separator:rgba(255,255,255,.14);
    --ink:#f4f3f8; --ink-muted:rgba(235,234,245,.62); --ink-faint:rgba(235,234,245,.34);
    --accent:#7d7bff; --accent-press:#9b99ff; --accent-soft:rgba(125,123,255,.26);
    --secondary:#40c8e0;
    --positive:#30d158; --warning:#ffd60a; --negative:#ff453a;
    --night-1:#6fbcf0; --night-2:#4d92dd; --day-1:#ffab5c; --day-2:#ff6b62;
    --aqi-1:#4ed16a; --aqi-2:#f2ca5c; --aqi-3:#ff9f4a; --aqi-4:#ff6b62;
    --aqi-5:#c07ae0; --aqi-6:#d4566f;
    --aqi-1-ink:#12101a; --aqi-2-ink:#12101a; --aqi-3-ink:#12101a;
    --aqi-4-ink:#12101a; --aqi-5-ink:#12101a; --aqi-6-ink:#12101a;
    --aqi-1-hatch:rgba(255,255,255,.38); --aqi-2-hatch:rgba(255,255,255,.38);
    --aqi-3-hatch:rgba(255,255,255,.38); --aqi-4-hatch:rgba(255,255,255,.38);
    --aqi-5-hatch:rgba(255,255,255,.38); --aqi-6-hatch:rgba(255,255,255,.38);
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 4px 16px -4px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.4);
    --shadow-3:0 12px 40px -8px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
}

  *, *::before, *::after { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    /* The ambient mesh is what makes glass worth having: without something
       coloured behind it, translucency just looks like dirty white. */
    background:
      radial-gradient(55% 45% at 10% 0%, color-mix(in srgb, var(--accent) 15%, transparent) 0%, transparent 60%),
      radial-gradient(52% 42% at 100% 4%, color-mix(in srgb, var(--secondary) 15%, transparent) 0%, transparent 58%),
      radial-gradient(65% 55% at 50% 106%, color-mix(in srgb, var(--day-1) 11%, transparent) 0%, transparent 62%),
      radial-gradient(120% 80% at 50% -10%, var(--surface-1) 0%, transparent 55%),
      var(--bg-tint);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      Inter, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  [data-theme="dark"] body, :root:not([data-theme="light"]) body {
    background-attachment:fixed;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body {
    background:
      radial-gradient(55% 45% at 10% 0%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 60%),
      radial-gradient(52% 42% at 100% 4%, color-mix(in srgb, var(--secondary) 10%, transparent) 0%, transparent 58%),
      radial-gradient(65% 55% at 50% 106%, color-mix(in srgb, var(--day-1) 8%, transparent) 0%, transparent 62%),
      radial-gradient(120% 80% at 50% -12%, var(--surface-1) 0%, transparent 55%),
      var(--bg-tint);
  }}
  :root[data-theme="dark"] body {
    background:
      radial-gradient(55% 45% at 10% 0%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 60%),
      radial-gradient(52% 42% at 100% 4%, color-mix(in srgb, var(--secondary) 10%, transparent) 0%, transparent 58%),
      radial-gradient(65% 55% at 50% 106%, color-mix(in srgb, var(--day-1) 8%, transparent) 0%, transparent 62%),
      radial-gradient(120% 80% at 50% -12%, var(--surface-1) 0%, transparent 55%),
      var(--bg-tint);
  }

  /* ── type scale (iOS-ish) ── */
  h1, h2, h3 { margin:0; font-weight:640; letter-spacing:-0.022em; text-wrap:balance; }
  h1 { font-size:clamp(30px,5.2vw,44px); line-height:1.05; font-weight:700; }
  h2 { font-size:clamp(21px,3vw,27px); line-height:1.12; }
  h3 { font-size:17px; line-height:1.3; letter-spacing:-0.01em; }
  p { margin:0; }
  /* figure carries a UA default of `1em 40px`, which quietly inset every chart
     card by 80px against the tiles above it. */
  figure, figcaption { margin:0; }
  .lede { font-size:clamp(15.5px,1.9vw,17px); color:var(--ink-muted); max-width:62ch; }
  .muted { color:var(--ink-muted); }
  .faint { color:var(--ink-faint); }
  .footnote { font-size:13px; color:var(--ink-muted); line-height:1.4; }
  .caption { font-size:12px; color:var(--ink-muted); }
  .tnum { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .display {
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
    font-weight:700; letter-spacing:-0.025em; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* ── glass materials ── */
  .glass {
    background:var(--glass-regular);
    backdrop-filter:var(--blur-md); -webkit-backdrop-filter:var(--blur-md);
    border:1px solid var(--border);
    box-shadow:inset 0 1px 0 var(--glass-highlight),
               inset 0 -1px 0 var(--glass-shadow-edge), var(--shadow-3);
  }
  .glass-card {
    position:relative; background:var(--glass-regular);
    backdrop-filter:var(--blur-md) brightness(1.06);
    -webkit-backdrop-filter:var(--blur-md) brightness(1.06);
    border:1px solid rgba(255,255,255,.45);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.9),
               inset 0 0 0 .5px rgba(255,255,255,.3), var(--shadow-2);
  }
  [data-theme="dark"] .glass-card, :root:not([data-theme="light"]) .glass-card {
    border-color:rgba(255,255,255,.12);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .glass-card {
    box-shadow:inset 0 1px 1px rgba(255,255,255,.14),
               inset 0 0 0 .5px rgba(255,255,255,.08), var(--shadow-2);
  }}
  :root[data-theme="dark"] .glass-card {
    border-color:rgba(255,255,255,.12);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.14),
               inset 0 0 0 .5px rgba(255,255,255,.08), var(--shadow-2);
  }
  .dock {
    background:var(--glass-thick);
    backdrop-filter:var(--blur-lg) brightness(1.08) saturate(180%);
    -webkit-backdrop-filter:var(--blur-lg) brightness(1.08) saturate(180%);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.95),
               inset 0 -1px 1px var(--glass-shadow-edge),
               0 10px 34px -6px rgba(24,22,40,.24), 0 2px 8px rgba(24,22,40,.1);
  }
  :root[data-theme="dark"] .dock, :root:not([data-theme="light"]) .dock {
    border-color:rgba(255,255,255,.14);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
    .glass, .glass-card, .dock { background:var(--surface-1); }
  }

  /* ── card ── */
  .card {
    background:var(--surface-1); border-radius:var(--r-md);
    box-shadow:var(--shadow-2); padding:20px;
  }
  .card-tight { padding:16px; }
  .card-head { display:flex; align-items:flex-start; justify-content:space-between;
    gap:12px; margin-bottom:4px; }
  .card-head h3 { font-size:15.5px; font-weight:640; }
  .card-head .sub { font-size:12.5px; color:var(--ink-muted); white-space:nowrap; }

  /* ── grouped inset list (the iOS workhorse) ── */
  .list { background:var(--surface-1); border-radius:var(--r-md);
    box-shadow:var(--shadow-2); overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 16px;
    position:relative; }
  .row + .row::before { content:""; position:absolute; left:16px; right:0; top:0;
    height:1px; background:var(--separator); }
  .row .grow { flex:1; min-width:0; }
  .row .val { font-variant-numeric:tabular-nums; font-weight:640; }

  /* Visually gone, still announced. The pickers carry their own labels for a
     screen reader without putting a second caption next to a control whose
     current value already says what it is. */
  .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }

  /* ── picker ──
     A native select, restyled. The page has more state than a row of segmented
     controls can hold without becoming a wall of pills, and a select collapses
     a list of any length to one line while keeping the platform's own keyboard
     handling, which a div-and-listbox reimplementation would have to earn back. */
  .picker { position:relative; display:inline-flex; align-items:center; }
  .picker select { appearance:none; -webkit-appearance:none; font:inherit;
    font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer;
    background:var(--surface-2); border:0; border-radius:var(--r-full);
    padding:8px 32px 8px 14px; box-shadow:var(--shadow-1); }
  .picker select:hover { background:var(--surface-3); }
  .picker select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .picker::after { content:""; position:absolute; right:13px; width:8px; height:8px;
    border-right:1.6px solid var(--ink-muted); border-bottom:1.6px solid var(--ink-muted);
    transform:translateY(-2px) rotate(45deg); pointer-events:none; }
  .picker.compact select { font-size:12.5px; padding:6px 28px 6px 11px; }
  .picker.compact::after { right:11px; width:6.5px; height:6.5px; }

  /* ── overflow menu ──
     Where the controls that modify a reading live, rather than the ones that
     choose it. Keeping them behind a button is what lets the view picker be the
     only thing competing for attention in the bar. */
  .overflow { position:relative; display:inline-flex; }
  .overflow > .menu { position:absolute; top:calc(100% + 8px); right:0; z-index:40;
    min-width:210px; padding:10px; border-radius:var(--r-sm);
    background:var(--surface-1); box-shadow:var(--shadow-3);
    border:1px solid var(--border); }
  .overflow > .menu[hidden] { display:none; }
  .menu .mlab { font-size:11px; font-weight:660; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-faint); margin:2px 2px 6px; }
  .menu .mgroup + .mgroup { margin-top:12px; padding-top:12px;
    border-top:1px solid var(--separator); }
  .menu .seg { background:var(--surface-2); }

  /* ── segmented control ── */
  .seg { position:relative; display:grid; background:var(--surface-2);
    border-radius:var(--r-full); padding:4px; user-select:none; }
  .seg .thumb { position:absolute; top:4px; bottom:4px; left:4px;
    border-radius:var(--r-full); background:var(--surface-1); box-shadow:var(--shadow-1);
    transition:transform .24s var(--ease-spring); }
  .seg button { position:relative; z-index:1; border:0; background:none; font:inherit;
    font-size:14px; font-weight:560; color:var(--ink-muted); padding:7px 14px;
    border-radius:var(--r-full); cursor:pointer; white-space:nowrap;
    transition:color .16s var(--ease-out); }
  .seg button[aria-checked="true"] { color:var(--ink); font-weight:620; }
  .seg button:hover { color:var(--ink); }

  /* ── chips & buttons ── */
  .chip { display:inline-flex; align-items:center; gap:6px; border:0; font:inherit;
    font-size:13px; font-weight:560; padding:7px 13px; border-radius:var(--r-full);
    background:var(--surface-2); color:var(--ink-muted); cursor:pointer; }
  .chip[aria-pressed="true"], .chip.on { background:var(--accent-soft); color:var(--accent); font-weight:620; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:0; font:inherit; font-size:14px; font-weight:600; padding:9px 16px;
    border-radius:var(--r-sm); background:var(--surface-2); color:var(--ink);
    cursor:pointer; }
  .btn-accent { background:var(--accent); color:var(--ink-on-accent); }

  /* ── press & focus ── */
  button, a, select, input, [role="button"], [role="radio"], .pressable {
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .pressable { transition:transform .14s var(--ease-out), background-color .14s var(--ease-out); }
  .pressable:active { transform:scale(.97); }
  :focus-visible { outline:none; box-shadow:0 0 0 4px var(--accent-soft), 0 0 0 1.5px var(--accent); border-radius:6px; }

  /* ── charts ── */
  svg.chart { display:block; width:100%; height:auto; overflow:visible; }
  .gridline { stroke:var(--separator); stroke-width:1; }
  .axisline { stroke:var(--border-strong); stroke-width:1; }
  .tick { fill:var(--ink-faint); font-size:10px; font-variant-numeric:tabular-nums; }
  .ref { stroke:var(--ink-faint); stroke-width:1.25; stroke-dasharray:3 3; }
  .ref-lab { fill:var(--ink-faint); font-size:9.5px; font-weight:600; }
  .mark-lab { fill:var(--ink); font-size:10px; font-weight:660; font-variant-numeric:tabular-nums; }
  .bar { cursor:pointer; }
  .chart-in { animation:fade-in .3s var(--ease-out) both; }
  @keyframes fade-in { from { opacity:0 } to { opacity:1 } }

  /* ── tooltip ── */
  .tip { position:fixed; pointer-events:none; opacity:0; z-index:60;
    transition:opacity .1s; background:var(--ink); color:var(--bg);
    padding:8px 11px; border-radius:var(--r-xs); font-size:12px; line-height:1.4;
    white-space:nowrap; transform:translate(-50%,-100%);
    box-shadow:0 8px 24px rgba(0,0,0,.28); }
  .tip b { font-variant-numeric:tabular-nums; font-weight:680; }
  .tip .k { opacity:.6; font-size:10.5px; letter-spacing:.04em; }

  /* ── layout ── */
  .wrap { max-width:var(--maxw); margin:0 auto;
    padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px)
            calc(var(--dock-h) + 46px + var(--safe-bottom)); }
  .grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }

  .grid-4 { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
  @media (max-width:900px) { .grid-3, .grid-4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:620px) { .grid-2, .grid-3, .grid-4 { grid-template-columns:1fr; } }
  .stack { display:flex; flex-direction:column; gap:16px; }

  @media (max-width:620px) {
    .bar-row { gap:8px; }
    .bar-row .spacer { display:none; }
    .bar-row > .seg { width:100%; }
    .seg button { padding:8px 6px; font-size:13px; }
  }
  .spacer { flex:1; }
  .no-scrollbar { scrollbar-width:none; }
  .no-scrollbar::-webkit-scrollbar { display:none; }
  [hidden] { display:none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  .topbar { display:flex; align-items:center; gap:14px; margin-bottom:clamp(20px,3vw,30px); }
  .brand { display:inline-flex; align-items:center; gap:9px; color:var(--ink);
    text-decoration:none; font-size:14.5px; font-weight:680; letter-spacing:-0.01em; }
  .brand:hover { text-decoration:none; }
  .brand-mark { width:23px; height:23px; flex:none; display:block;
    border-radius:6px; box-shadow:0 1px 3px rgba(94,92,230,.35); }
  .stamp { font-size:12.5px; color:var(--ink-faint); }

  .iconbtn { display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border:0; border-radius:var(--r-full); cursor:pointer;
    background:var(--surface-1); color:var(--ink-muted); box-shadow:var(--shadow-1);
    font-size:15px; line-height:1; }
  .iconbtn:hover { color:var(--ink); }

  .hero { margin-bottom:clamp(20px,3vw,28px); }
  .hero .kicker { font-size:14px; font-weight:600; color:var(--accent); margin-bottom:6px; }
  .hero h1 { margin-bottom:10px; }

  /* The dock floats over the content it belongs to; it does not sit in the flow.
     Left-aligned rather than centred so it never covers the middle of a chart. */
  .dockwrap { position:fixed; inset-inline:0; z-index:50; display:flex;
    justify-content:center; pointer-events:none;
    bottom:calc(12px + var(--safe-bottom)); padding-inline:16px; }
  .dock { pointer-events:auto; display:flex; align-items:center; gap:4px;
    border-radius:var(--r-full); padding:6px; }
  .dock a, .dock button { display:flex; flex-direction:column; align-items:center;
    gap:2px; border:0; background:none; font:inherit; cursor:pointer;
    padding:6px 14px; border-radius:var(--r-full); color:var(--ink-faint);
    text-decoration:none; transition:all .2s var(--ease-spring); }
  .dock a:hover, .dock button:hover { color:var(--ink-muted); text-decoration:none; }
  .dock a[aria-current="page"] { background:var(--accent-soft); color:var(--accent); padding-inline:18px; }
  .dock .glyph { font-size:19px; line-height:1; }
  .dock .lab { font-size:11px; font-weight:560; line-height:1.1; }
  .dock a[aria-current="page"] .lab { font-weight:660; }
  .dock .sep { width:1px; align-self:stretch; margin:6px 4px; background:var(--separator); }

  /* Desktop navigation. Deliberately not styled as a pill: the pages already
     carry segmented toggles for views and scales, and a third pill in the
     chrome would read as one more control rather than as where you are. A nav
     bar underlines the current page and leaves it at that. */
  .mainnav { display:none; align-items:center; gap:20px; margin-left:8px; }
  .mainnav a { position:relative; padding:3px 1px; font-size:14px; font-weight:560;
    color:var(--ink-faint); text-decoration:none; transition:color .15s var(--ease-out); }
  .mainnav a:hover { color:var(--ink); text-decoration:none; }
  .mainnav a[aria-current="page"] { color:var(--ink); font-weight:660; }
  .mainnav a[aria-current="page"]::after { content:""; position:absolute; left:0; right:0;
    bottom:-7px; height:2px; border-radius:2px; background:var(--accent); }
  .topbar .theme-btn { display:none; }

  /* One breakpoint decides which navigation the page has, and only one of the
     two is ever in the document's flow. 1024px is where the budget app makes
     the same call. */
  @media (min-width:1024px) {
    .mainnav { display:flex; }
    .topbar .theme-btn { display:inline-flex; }
    .dockwrap { display:none; }
    .wrap { padding-bottom:clamp(28px,4vw,48px); }
  }

  .nf { min-height:68vh; display:flex; flex-direction:column; justify-content:center;
    max-width:44ch; }
  .nf .code { font-size:13px; font-weight:640; letter-spacing:.1em; color:var(--accent);

  .nf h1 { margin-bottom:12px; }
  .nf .links { display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
  .nf .links a { display:inline-flex; align-items:center; padding:10px 18px;
    border-radius:var(--r-full); background:var(--surface-1); box-shadow:var(--shadow-2);
    color:var(--ink); font-size:14px; font-weight:600; }
  .nf .links a:hover { text-decoration:none; color:var(--accent); }
  .nf .links a.primary { background:var(--accent); color:var(--ink-on-accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar"><a class="brand" href="/"><svg class='brand-mark' xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="wxmark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f6dff"/><stop offset="1" stop-color="#2ea8bf"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#wxmark)"/><g fill="none" stroke="#fff" stroke-linecap="round"><path d="M14 42c6-13 12-19 18-19s12 6 18 19" stroke-width="5"/><path d="M20 49h24" stroke-width="4.5" stroke-opacity=".55"/><circle cx="32" cy="30" r="3.5" fill="#fff" stroke="none"/></g></svg><span>Weather</span></a><nav class="mainnav" aria-label="Sections"><a href="/">Overview</a><a href="/london">London</a><a href="/beijing">Beijing</a></nav><span class="spacer"></span><span class="stamp"></span><button class="iconbtn pressable theme-btn" aria-label="Switch colour theme" title="Theme"><svg class="glyph" viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18zm0 2.2v13.6a6.8 6.8 0 0 1 0-13.6z"/></svg></button></header>
  <div class="nf">
    <p class="code">404</p>
    <h1>There is no reading here</h1>
    <p class="lede">That address does not match anything this site publishes. The three
      pages below are all of it.</p>
    <div class="links">
      <a class="primary" href="/">Overview</a>
      <a href="/london">London</a>
      <a href="/beijing">Beijing</a>
    </div>
  </div>
</div>

<script>
(function(){
  var btns=[].slice.call(document.querySelectorAll('.theme-btn')); if(!btns.length) return;
  var root=document.documentElement;
  function cur(){ try{ return localStorage.getItem('theme')||'system'; }catch(e){ return 'system'; } }
  function apply(v){
    if(v==='system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',v);
    try{ v==='system'? localStorage.removeItem('theme') : localStorage.setItem('theme',v); }catch(e){}
    btns.forEach(function(b){
      b.title='Theme: '+v;
      b.setAttribute('aria-label','Colour theme: '+v+'. Click to change.');
    });
  }
  apply(cur());
  btns.forEach(function(b){ b.addEventListener('click',function(){
    var order=['system','light','dark']; apply(order[(order.indexOf(cur())+1)%3]);
  }); });
})();
</script>
